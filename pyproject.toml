[project]
name = "agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yeaun12", email = "90236983+yeaun12@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-lab = "agent_lab:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]  # data/repos 안의 남의 테스트는 모으지 않는다
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: 실제 API를 부르는 테스트 (무료 한도를 쓴다)"]

[tool.ruff]
extend-exclude = ["data"]  # clone한 남의 저장소는 검사하지 않는다
