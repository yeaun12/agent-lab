<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>repo-pilot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 24px auto; padding: 0 16px; color: #1d2330; }
  textarea { width: 100%; height: 64px; font: inherit; padding: 8px; box-sizing: border-box; }
  button { margin-top: 8px; padding: 8px 18px; font: inherit; cursor: pointer; }
  .step { border-left: 3px solid #9aa7bd; padding: 4px 10px; margin: 8px 0; font-size: 14px; }
  .step.bad { border-color: #c0392b; }
  .step pre, #code { background: #f4f6fa; padding: 8px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; }
  #answer { background: #eef6ee; padding: 12px; margin-top: 12px; line-height: 1.6; white-space: pre-wrap; }
  .cite { color: #1a5fb4; cursor: pointer; text-decoration: underline; }
  .meta { color: #66708a; font-size: 13px; }
</style>
</head>
<body>
<h1>repo-pilot · httpx 코드 질문</h1>
<textarea id="q">기본 타임아웃은 몇 초이고 어디에 정의돼 있나?</textarea>
<select id="model"><option>fast</option><option>smart</option><option>long</option></select>
<button id="go">질문하기</button>
<div id="steps"></div>
<div id="answer" hidden></div>
<p class="meta" id="meta"></p>
<pre id="code" hidden></pre>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// 답 속의 '경로:줄'을 누를 수 있는 링크로 바꾼다
function linkCitations(text) {
  return esc(text).replace(/([\w./-]+\.(?:py|md)):(\d+)(?:-(\d+))?/g,
    (m, path, s, e) => `<span class="cite" data-path="${path}" data-s="${s}" data-e="${e || s}">${m}</span>`);
}

$("answer").addEventListener("click", async (ev) => {
  const c = ev.target.closest(".cite"); if (!c) return;
  const r = await fetch(`/code?path=${encodeURIComponent(c.dataset.path)}&start=${c.dataset.s}&end=${+c.dataset.e + 5}`);
  const data = await r.json();
  $("code").hidden = false; $("code").textContent = data.text;
});

function show(event) {
  if (event.type === "step") {
    const div = document.createElement("div");
    div.className = "step" + (event.ok ? "" : " bad");
    div.innerHTML = `<b>${event.n}. ${esc(event.tool)}</b> <span class="meta">${esc(event.args)} · ${event.ms}ms</span>` +
      (event.thought ? `<div>${esc(event.thought)}</div>` : "") + `<pre>${esc(event.result_preview)}</pre>`;
    $("steps").appendChild(div);
  } else if (event.type === "answer") {
    $("answer").hidden = false; $("answer").innerHTML = linkCitations(event.text);
    $("meta").textContent = `${event.stopped} · 단계 ${event.steps} · 호출 ${event.calls}회 · ${event.tokens}토큰 · ${event.model}`;
  } else if (event.type === "error") {
    $("answer").hidden = false; $("answer").textContent = "오류: " + event.text;
  }
}

$("go").addEventListener("click", async () => {
  $("steps").innerHTML = ""; $("answer").hidden = true; $("code").hidden = true; $("meta").textContent = "생각하는 중…";
  // EventSource는 GET만 보낼 수 있어서 fetch로 POST를 보내고, 응답 본문을 조금씩 읽는다
  const r = await fetch("/ask", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question: $("q").value, model: $("model").value }),
  });
  const reader = r.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const blocks = buffer.split("\n\n");  // SSE는 빈 줄로 덩어리를 나눈다
    buffer = blocks.pop();  // 마지막 조각은 아직 덜 왔을 수 있어 남겨 둔다
    for (const block of blocks) {
      const data = block.replace(/^data: /, "");
      if (data === "[DONE]") return;
      show(JSON.parse(data));
    }
  }
});
</script>
</body>
</html>
